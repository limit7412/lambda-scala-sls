service: lambda-scala-sls

plugins:
  - serverless-plugin-scripts

custom:
  defaultStage: dev
  scripts:
    hooks:
      # パッケージング (zip 化) の直前に、Lambda 互換のネイティブバイナリ bootstrap を
      # Docker 内でビルドして取り出す。
      # set -e と rm -f は、docker のビルドが失敗したときに前回の bootstrap を
      # 掴んだままデプロイしてしまうのを防ぐためのもの。プラグインはこのフックを
      # execSync (= sh -c) で実行するため、既定では途中のコマンドが失敗しても
      # 後続へ進んでしまい、最後の chmod さえ成功すればフック全体が成功扱いになる。
      # そうして残った古いバイナリがアーキテクチャの合わないものだと、デプロイ後に
      # Runtime.InvalidEntrypoint で起動しなくなる。
      "before:package:createDeploymentArtifacts": |
        set -e
        rm -f bootstrap
        docker build --platform linux/amd64 -t lambda-scala-sls-build .
        id=$(docker create --platform linux/amd64 lambda-scala-sls-build)
        docker cp "$id":/work/bootstrap ./bootstrap
        docker rm "$id"
        chmod +x bootstrap

provider:
  name: aws
  runtime: provided.al2023
  # ビルドに使う scala-cli 公式イメージが amd64 のみの提供のため、x86_64 にする (#28)
  architecture: x86_64
  timeout: 20
  region: ap-northeast-1
  stage: ${opt:stage, self:custom.defaultStage}

# zip には bootstrap のみ含める
package:
  patterns:
    - "!**"
    - bootstrap

functions:
  hello:
    # handler の値は実行時に環境変数 _HANDLER として渡され、Lambda.scala の
    # Handler がこの名前で呼び出す関数を選ぶ
    handler: hello
    events:
      - http:
          path: test
          method: get
  world:
    handler: world
    events:
      - http:
          path: test
          method: post
